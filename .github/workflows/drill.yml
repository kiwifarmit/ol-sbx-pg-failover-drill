name: drill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "scenarios (comma list or all)"
        default: "kill-primary,switchover,lagging-replicas-failover"
      modes:
        description: "modes (async,sync,strict or all)"
        default: "async,sync"

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uvx ruff check src tests
      - run: uv run pytest -q

  drill:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCENARIOS: ${{ inputs.scenarios || 'kill-primary,switchover,lagging-replicas-failover' }}
      MODES: ${{ inputs.modes || 'async,sync' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: podman info
        run: podman version && podman info --format '{{.Host.NetworkBackend}} rootless={{.Host.Security.Rootless}}'
      - name: build lab image
        run: uv run pgdrill lab build
      - name: run drill
        # Fails the job on the safety checks only: a crashed run, split brain, writes that
        # never resume, a cluster that does not heal, hung writers, unexplained rows, or any
        # acknowledged write lost in sync mode. No --max-rto/--max-rpo: timings on shared
        # runners vary too much, and async loss (or a refused failover) is expected behaviour.
        run: uv run pgdrill run --scenarios "$SCENARIOS" --modes "$MODES" --out drill-report
      - name: job summary
        if: always()
        run: test -f drill-report/report.md && cat drill-report/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: drill-report
          path: drill-report/
