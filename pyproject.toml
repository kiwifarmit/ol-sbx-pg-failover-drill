[project]
name = "pg-failover-drill"
version = "0.1.0"
description = "Failover drills for Patroni/PostgreSQL clusters: measured RTO, RPO and split-brain, reported in Oracle Data Guard terms"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Host side is stdlib only. psycopg is only needed inside the lab image (already installed there).
dependencies = []

[project.scripts]
pgdrill = "pgdrill.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgdrill"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "RUF", "PLW", "ISC"]
# RUF001: the "–" placeholder in report cells is intended. RUF005: style only.
ignore = ["RUF001", "RUF005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["podman: needs a working podman and builds the lab (slow)"]
addopts = "-m 'not podman'"
